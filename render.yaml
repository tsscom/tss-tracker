# Link this Blueprint to the private GitHub repository before the first deployment.
# Initialize production data explicitly; local staging initialization is never run here.
services:
  - type: web
    name: tss-tracker
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: tss-uploads
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENV_FILE
        value: ""
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: STORAGE_BACKEND
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: tss-production-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
      - key: ATTACHMENTS_DIR
        value: /var/data/attachments
      - key: PUBLIC_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "1"

databases:
  - name: tss-production-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: tss_production
    user: tss_production
    diskSizeGB: 15
    ipAllowList: []
